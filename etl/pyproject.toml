[project]
name = "ozi-etl"
version = "0.1.0"
requires-python = ">=3.13, <3.14"
dependencies = [
    "httpx>=0.27.2",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "SQLAlchemy>=2.0.36,<2.1",
    "tenacity>=9.0.0",
    "psycopg2-binary>=2.9.11",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "requests-mock>=1.12.0",
    "respx>=0.22.0",
]

[tool.uv]
package = false
