# Docker Compose Overlay for DuckLake (MinIO local storage + Litestream replication + Catalog volume)
services:
  minio:
    image: minio/minio:latest
    container_name: ozi_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${OZI_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OZI_S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - ozi_network

  litestream:
    image: litestream/litestream:0.3.13
    container_name: ozi_litestream
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    volumes:
      - lake_catalog:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      OZI_S3_ENDPOINT: ${OZI_S3_ENDPOINT:-http://minio:9000}
      OZI_S3_BUCKET: ${OZI_S3_BUCKET:-ozi_lake}
      OZI_S3_ACCESS_KEY_ID: ${OZI_S3_ACCESS_KEY_ID:-minioadmin}
      OZI_S3_SECRET_ACCESS_KEY: ${OZI_S3_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      - minio
    networks:
      - ozi_network

  ozi-etl:
    volumes:
      - lake_catalog:/data
    environment:
      OZI_LAKE_CATALOG: /data/ozi_lake.sqlite
      OZI_LAKE_DATA_PATH: ${OZI_LAKE_DATA_PATH:-s3://ozi_lake/ozi_lake/}
      OZI_S3_ENDPOINT: ${OZI_S3_ENDPOINT:-http://minio:9000}
      OZI_S3_BUCKET: ${OZI_S3_BUCKET:-ozi_lake}
      OZI_S3_ACCESS_KEY_ID: ${OZI_S3_ACCESS_KEY_ID:-minioadmin}
      OZI_S3_SECRET_ACCESS_KEY: ${OZI_S3_SECRET_ACCESS_KEY:-minioadmin}
      OZI_S3_REGION: ${OZI_S3_REGION:-fsn1}
      OZI_S3_USE_SSL: ${OZI_S3_USE_SSL:-false}
      OZI_S3_URL_STYLE: ${OZI_S3_URL_STYLE:-path}
    depends_on:
      minio:
        condition: service_started

  plotly-dash-app:
    volumes:
      - lake_catalog:/data
    environment:
      OZI_LAKE_CATALOG: /data/ozi_lake.sqlite
      OZI_LAKE_DATA_PATH: ${OZI_LAKE_DATA_PATH:-s3://ozi_lake/ozi_lake/}
      OZI_S3_ENDPOINT: ${OZI_S3_ENDPOINT:-http://minio:9000}
      OZI_S3_BUCKET: ${OZI_S3_BUCKET:-ozi_lake}
      OZI_S3_ACCESS_KEY_ID: ${OZI_S3_ACCESS_KEY_ID:-minioadmin}
      OZI_S3_SECRET_ACCESS_KEY: ${OZI_S3_SECRET_ACCESS_KEY:-minioadmin}
      OZI_S3_REGION: ${OZI_S3_REGION:-fsn1}
      OZI_S3_USE_SSL: ${OZI_S3_USE_SSL:-false}
      OZI_S3_URL_STYLE: ${OZI_S3_URL_STYLE:-path}
    depends_on:
      minio:
        condition: service_started

volumes:
  lake_catalog:
  minio_data:
